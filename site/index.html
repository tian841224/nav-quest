<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>導航任務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="screen" id="app" data-screen="start">
  <div class="stage">

    <header class="topbar">
      <div class="brand">尋找森林中的寶藏</div>
      <div class="step-pill">
        <span class="step-label" id="step-label"></span>
        <div class="progress" id="progress" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </header>

    <!-- 1 確認位置 -->
    <section class="view" data-view="start" hidden>
      <h1 class="start-title">
        <span>恭喜你！</span>
        <span>你發現園區的神祕寶藏線索</span>
        <span>跟著指示找出寶藏吧！</span>
      </h1>
      <div class="start-instructions">
        <p>完成三個步驟</p>
        <p>找到藏寶地點並出示畫面即可獲得神秘寶藏。</p>
      </div>
      <div class="actions actions-start">
        <button type="button" class="btn btn-light" id="locate-btn">確認我的位置</button>
      </div>
    </section>

    <!-- 1b 不在範圍／定位失敗：定位圖示已在背景圖裡 -->
    <section class="view view-blocked" data-view="blocked" hidden>
      <div class="blocked-text">
        <h1 class="title" id="blocked-title"></h1>
        <p class="lead" id="blocked-message"></p>
      </div>
      <div class="place-card">
        <div class="place-label">活動地點</div>
        <div class="place-name" data-dest-name></div>
        <div class="place-detail" id="blocked-detail"></div>
      </div>
      <p class="tip" id="blocked-tip"></p>
      <div class="actions actions-bottom">
        <button type="button" class="btn btn-light" id="retry-btn">重新確認位置</button>
      </div>
    </section>

    <!-- 2 任務進行中 -->
    <section class="view" data-view="task" hidden>
      <h1 class="title title-top">出發尋找寶藏吧！</h1>
      <p class="lead lead-top">抵達後出示此畫面，由工作人員協助兌換。</p>

      <div class="map-card">
        <div class="map-frame">
          <iframe id="map-frame" title="目的地位置地圖" loading="lazy" referrerpolicy="no-referrer"></iframe>
        </div>
      </div>

      <div class="actions actions-task">
        <a class="btn btn-light" id="nav-link" target="_blank" rel="noopener">出發尋寶</a>
        <button type="button" class="btn btn-dark btn-spaced" id="redeem-btn">兌獎</button>
      </div>
    </section>

    <!-- 4 已兌換 -->
    <section class="view" data-view="redeemed" hidden>
      <h1 class="title title-top">獲得寶藏！</h1>

      <div class="ig-card">
        <iframe class="ig-embed" src="https://www.instagram.com/hechizos1368_6/embed" title="Instagram 個人頁 @hechizos1368_6" loading="lazy"></iframe>
        <a class="btn btn-dark" href="https://www.instagram.com/hechizos1368_6/" target="_blank" rel="noopener">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.500" cy="6.500" r="0.800" fill="currentColor"></circle></svg>
          前往 Instagram 追蹤
        </a>
      </div>

      <div class="receipt">
        <div class="receipt-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        </div>
        <div class="receipt-info">
          <span class="receipt-label">兌獎時間</span>
          <span class="receipt-date" id="redeemed-date"></span>
        </div>
        <strong class="receipt-time" id="redeemed-time"></strong>
      </div>
    </section>

  </div>
</main>

<!-- 3 兌獎確認 -->
<div class="sheet" id="confirm-sheet" hidden>
  <div class="sheet-backdrop" data-close-sheet></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
    <h2 class="title-sheet" id="confirm-title">確認兌獎？</h2>
    <p class="sheet-desc" id="confirm-desc">請由工作人員確認並兌換。確認後無法復原。</p>
    <div class="sheet-actions">
      <button type="button" class="btn btn-dark" id="confirm-btn">工作人員確認兌換</button>
      <button type="button" class="btn btn-light" id="cancel-btn" data-close-sheet>取消</button>
    </div>
  </div>
</div>

<script>
  ['./config.js?v=' + Date.now(), './app.js'].forEach(function (src) {
    var script = document.createElement('script');
    script.async = false;
    script.src = src;
    document.body.appendChild(script);
  });
</script>
</body>
</html>
