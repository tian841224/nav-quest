<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>任務進行中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6B4F}a:hover{color:#074A37}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 24px 32px; background: #F3F5F4; color: #14201B; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.08em">導航任務</div>
      <div style="font-size: 13px; color: #4B5A53">步驟 2／3</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; border-radius: 2px; background: #0B6B4F"></div>
      <div style="height: 4px; border-radius: 2px; background: #0B6B4F"></div>
      <div style="height: 4px; border-radius: 2px; background: #C9D2CD"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; color: #0B6B4F">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6B4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      已確認位置，任務開始
    </div>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.3; font-weight: 900">前往 [店名]</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #4B5A53">[任務內容：導航到店家，到店後出示此畫面，即可兌換禮物一份]</p>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 1px solid #D5DCD8; overflow: hidden">
    <div style="flex-grow: 1; min-height: 0; background: #E3EFEA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #2E5A4B">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0B6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <div style="font-size: 14px; font-weight: 500">[店家位置地圖圖片]</div>
    </div>
    <div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 17px; font-weight: 700">[店名]</div>
      <div style="font-size: 14px; line-height: 1.6; color: #4B5A53">[店家地址]</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="https://www.google.com/maps/dir/?api=1" style="height: 56px; border-radius: 14px; background: #0B6B4F; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"></path></svg>
      開始導航
    </a>
    <a href="Confirm.dc.html" style="height: 56px; border-radius: 14px; background: #FFFFFF; border: 2px solid #14201B; box-sizing: border-box; color: #14201B; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">兌獎</a>
    <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4B5A53; text-align: center">兌獎請到店後交由店員操作，自行點擊視同已兌換。</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
