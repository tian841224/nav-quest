<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>已兌換</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E3EFEA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 24px 32px; background: #0B6B4F; color: #FFFFFF; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.08em">導航任務</div>
      <div style="font-size: 13px">步驟 3／3</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; border-radius: 2px; background: #FFFFFF"></div>
      <div style="height: 4px; border-radius: 2px; background: #FFFFFF"></div>
      <div style="height: 4px; border-radius: 2px; background: #FFFFFF"></div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 14px">
    <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B6B4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 900">任務成功</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.5">已在 [店名] 完成兌換</p>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center">
    <div style="padding: 32px 24px 24px; border-radius: 24px; background: #FFFFFF; color: #14201B; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
      <div style="width: 112px; height: 112px; border-radius: 56px; background: #E3EFEA; border: 4px solid #0B6B4F; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #2E5A4B">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0B6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.8" fill="#0B6B4F"></circle></svg>
        <div style="font-size: 11px; font-weight: 500">[IG 大頭照]</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 24px; line-height: 1.3; font-weight: 900">追蹤 [店名]</div>
        <div style="font-size: 16px; color: #4B5A53">@hechizos1368_6</div>
        <div style="font-size: 14px; line-height: 1.6; color: #4B5A53">在 Instagram 追蹤我們的最新動態</div>
      </div>
      <a href="https://www.instagram.com/hechizos1368_6/" target="_blank" rel="noopener" style="align-self: stretch; height: 56px; border-radius: 14px; background: #0B6B4F; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.8" fill="#FFFFFF"></circle></svg>
        前往 Instagram 追蹤
      </a>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.45); display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <div>兌換時間</div>
        <div style="font-weight: 700">[核銷日期時間]</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px; text-align: right">
        <div>現在時間</div>
        <div style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.02em">{{now}}</div>
      </div>
    </div>
    <p style="margin: 0; font-size: 12px; line-height: 1.6; text-align: center">此畫面的時間會持續跳動。每支手機限兌換一次。</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => this.forceUpdate(), 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const d = new Date();
const p = (n) => String(n).padStart(2, '0');
return { now: p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) };
}
}
</script>
</body>
</html>
